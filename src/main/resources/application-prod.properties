# prod
# Injetar API_SERVER_URL=/ccomp-api no .env
api.server.url=/ 

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.root=warn
logging.level.com.ccomp.br=info

# JWT
jwt.access.expiration=900

# Erros
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# Actuator
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.hikari.connections.acquire=true
management.metrics.distribution.percentiles-histogram.hikari.connections.usage=true

# Datasource
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
