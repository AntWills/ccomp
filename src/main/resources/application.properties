spring.application.name=ccomp
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jackson.deserialization.accept-empty-string-as-null-object=true
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.threads.virtual.enabled=true
spring.task.execution.mode=FORCE
server.forward-headers-strategy=FRAMEWORK
spring.output.ansi.enabled=ALWAYS

#springdoc.api-docs.enabled=true
#springdoc.swagger-ui.enabled=true
# Se você usa prefixos personalizados:
#springdoc.api-docs.path=/v3/api-docs

springdoc.cache.disabled=true
springdoc.swagger-ui.tags-sorter=alpha

# 15 minutos
jwt.access.expiration=900
# 7 dias
jwt.refresh.expiration=604800
jwt.public.key=${PUBLIC_KEY}
jwt.private.key=${PRIVITE_KEY}

#jwt.public.key=file:/app/keys/public.key
#jwt.private.key=file:/app/keys/private.key

# Para o banco
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver

# para email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}

# para storage
storage.endpoint=${STORAGE_ENDPOINT}
storage.access-key=${STORAGE_USER}
storage.secret-key=${STORAGE_PASSWORD}
storage.bucket=${STORAGE_BUCKET}
storage.region=${STORAGE_REGION}

#Open Telemetry
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.url=${OTEL_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
