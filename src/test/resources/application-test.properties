# Configuraão de E-mail (valores dummy para os testes)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Aponta para a porta 5433 e banco ccomp-db-test
spring.datasource.url=jdbc:postgresql://localhost:5433/ccomp-db-test
spring.datasource.username=user
spring.datasource.password=password
#spring.datasource.driver-class-name=org.postgresql.Driver

# Execução de migrações e validação
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate

# Deixa o log do Spring menos verboso (apenas Erros e Warns para pacotes comuns)
logging.level.org.springframework=WARN
logging.level.com.samu.api=DEBUG

# Mostra o SQL formatado e os parÃ¢metros passados
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Mostra detalhes das requisiÃ§Ãµes chegando no seu Controller
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Habilita cores no console (se sua IDE suportar, o que o IntelliJ faz)
spring.output.ansi.enabled=ALWAYS
