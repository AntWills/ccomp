spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.h2.console.enabled=true
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=ALWAYS
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# Deixa o log do Spring menos verboso (apenas Erros e Warns para pacotes comuns)
logging.level.org.springframework=WARN
logging.level.com.samu.api=DEBUG

# Mostra o SQL formatado e os parâmetros passados
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Mostra detalhes das requisições chegando no seu Controller
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Habilita cores no console (se sua IDE suportar, o que o IntelliJ faz)
spring.output.ansi.enabled=ALWAYS

# Define um padrão de log mais limpo: [Data] [Nível] [Thread] [Classe]: Mensagem
#logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx