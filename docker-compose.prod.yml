name: ccomp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    logging: *default-logging
    build:
      context: gateway
    ports:
      - "127.0.0.1:8080:8080"
    profiles: [all]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    depends_on:
      ccomp-backend:
        condition: service_healthy

  ccomp-backend:
    logging: *default-logging
    build: .
    profiles: [all]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0"
    labels:
      prometheus.scrape: "true"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    depends_on:
      grafana-lgtm:
        condition: service_started
      seaweeds:
        condition: service_healthy
      seaweeds-setup:
        condition: service_completed_successfully
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health/liveness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./keys:/app/keys

  postgres-db:
    logging: *default-logging
    image: postgres:17-alpine
    profiles: [ all, infra ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2500M
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./observability/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all

  postgres-exporter:
    logging: *default-logging
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [ all, infra ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres-db:
        condition: service_healthy
    command:
      - --collector.stat_statements
      - --collector.stat_checkpointer

  seaweeds:
    logging: *default-logging
    image: chrislusf/seaweedfs:latest
    profiles: [ all, infra ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    environment:
      STORAGE_USER: ${STORAGE_USER}
      STORAGE_PASSWORD: ${STORAGE_PASSWORD}
    entrypoint: >
      sh -c "
      mkdir -p /etc/seaweedfs &&
      printf '{\"identities\":[{\"name\":\"%s\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\"]}]}' \"$$STORAGE_USER\" \"$$STORAGE_USER\" \"$$STORAGE_PASSWORD\" > /etc/seaweedfs/s3.json &&
      weed server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -dir=/data -metricsPort=9327
      "
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9333/cluster/status" ]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweeds-setup:
    logging: *default-logging
    image: amazon/aws-cli
    profiles: [ all, infra ]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    depends_on:
      seaweeds:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_USER}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: >
      -c "
      until curl -s http://seaweeds:9000 > /dev/null; do echo 'Aguardando S3 API...'; sleep 2; done;
      aws --endpoint-url http://seaweeds:9000 s3 mb s3://images || true;
      "

  rabbitmq:
    logging: *default-logging
    image: rabbitmq:4.3.5-management-alpine
    container_name: ccomp-rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    image: redis:7-alpine
    profiles: [all, infra]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 640M
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  redis-exporter:
    logging: *default-logging
    image: oliver006/redis_exporter:v1.76.0
    profiles: [ all, infra ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  grafana-lgtm:
    logging: *default-logging
    image: 'grafana/otel-lgtm:latest'
    profiles: [ all, infra ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      LOKI_EXTRA_ARGS: "-store.retention=720h -compactor.retention-enabled=true -compactor.delete-request-store=filesystem"
    volumes:
      - grafana-lgtm-data:/data

  prometheus:
    logging: *default-logging
    image: prom/prometheus:latest
    profiles: [ all, infra ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus-data:/prometheus

  alloy:
    logging: *default-logging
    image: grafana/alloy:latest
    profiles: [all, infra]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    depends_on:
      grafana-lgtm:
        condition: service_started
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

volumes:
  postgres-data:
  seaweed-data:
  rabbitmq_data:
  redis-data:
  grafana-lgtm-data:
  prometheus-data:
  alloy-data:
