services:
  proxy:
    build:
      context: gateway
    ports:
      - "8080:8080"
    profiles: [all]
    depends_on:
      - ccomp-backend

  ccomp-backend:
    build: .
    profiles: [all]
    env_file:
      - .env.dev
    depends_on:
      grafana-lgtm:
        condition: service_started
      seaweeds:
        condition: service_healthy
      seaweeds-setup:
        condition: service_completed_successfully
      postgres-db:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully
    volumes:
      - ./keys:/app/keys

  postgres-db:
    image: postgres:17-alpine
    profiles: [all, infra]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ccomp-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-db-test:
    image: postgres:17-alpine
    profiles: [ test ]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ccomp-db-test
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=auto_explain"

  seaweeds:
    image: chrislusf/seaweedfs:latest
    profiles: [ all, infra ]
    ports:
      - "9000:9000"
      - "9333:9333"
    environment:
      STORAGE_USER: admin
      STORAGE_PASSWORD: admin
    entrypoint: >
      sh -c "
      mkdir -p /etc/seaweedfs &&
      printf '{\"identities\":[{\"name\":\"%s\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\"]}]}' \"$$STORAGE_USER\" \"$$STORAGE_USER\" \"$$STORAGE_PASSWORD\" > /etc/seaweedfs/s3.json &&
      weed server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -dir=/data
      "
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9333/cluster/status" ]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweeds-setup:
    image: amazon/aws-cli
    profiles: [ all, infra ]
    depends_on:
      seaweeds:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: >
      -c "
      until curl -s http://seaweeds:9000 > /dev/null; do echo 'Aguardando S3 API...'; sleep 2; done;
      aws --endpoint-url http://seaweeds:9000 s3 mb s3://images || true;
      aws --endpoint-url http://seaweeds:9000 s3api put-bucket-policy --bucket images --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::images/*\"}]}';
      "

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    container_name: ccomp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keygen:
    image: alpine/openssl
    profiles: [all, infra]
    volumes:
      - ./keys:/keys
    entrypoint: sh
    command: >
      -c "
      if [ ! -f /keys/private.key ]; then
        openssl genpkey -algorithm RSA -out /keys/private.key -pkeyopt rsa_keygen_bits:2048;
        openssl rsa -pubout -in /keys/private.key -out /keys/public.key;
        chmod 644 /keys/private.key /keys/public.key;
        echo 'Chaves de dev geradas em ./keys';
      else
        echo 'Chaves já existem, pulando geração.';
      fi"

  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    profiles: [all, infra]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: false
    ports:
      - '3000:3000' # UI
      - '4317:4317'
      - '4318:4318'

volumes:
  postgres-data:
  seaweed-data:
  rabbitmq_data:
