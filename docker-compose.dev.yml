name: ccomp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    logging: *default-logging
    build:
      context: gateway
    ports:
      - "8080:8080"
    profiles: [all]
    depends_on:
      - ccomp-backend

  ccomp-backend:
    logging: *default-logging
    build: .
    profiles: [all]
    env_file:
      - .env.dev
    depends_on:
      grafana-lgtm:
        condition: service_started
      seaweeds:
        condition: service_healthy
      seaweeds-setup:
        condition: service_completed_successfully
      postgres-db:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./keys:/app/keys

  postgres-db:
    logging: *default-logging
    image: postgres:17-alpine
    profiles: [all, infra]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ccomp-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-db-test:
    logging: *default-logging
    image: postgres:17-alpine
    profiles: [ test ]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ccomp-db-test
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=auto_explain"

  seaweeds:
    logging: *default-logging
    image: chrislusf/seaweedfs:latest
    profiles: [ all, infra ]
    ports:
      - "9000:9000"
      - "9333:9333"
    environment:
      STORAGE_USER: admin
      STORAGE_PASSWORD: admin
    entrypoint: >
      sh -c "
      mkdir -p /etc/seaweedfs &&
      printf '{\"identities\":[{\"name\":\"%s\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\"]}]}' \"$$STORAGE_USER\" \"$$STORAGE_USER\" \"$$STORAGE_PASSWORD\" > /etc/seaweedfs/s3.json &&
      weed server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -dir=/data
      "
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9333/cluster/status" ]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweeds-setup:
    logging: *default-logging
    image: amazon/aws-cli
    profiles: [ all, infra ]
    depends_on:
      seaweeds:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: >
      -c "
      until curl -s http://seaweeds:9000 > /dev/null; do echo 'Aguardando S3 API...'; sleep 2; done;
      aws --endpoint-url http://seaweeds:9000 s3 mb s3://images || true;
      aws --endpoint-url http://seaweeds:9000 s3api put-bucket-policy --bucket images --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::images/*\"}]}';
      "

  redis:
    logging: *default-logging
    image: redis:7-alpine
    profiles: [all, infra]
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  rabbitmq:
    logging: *default-logging
    image: rabbitmq:4.3.5-management-alpine
    container_name: ccomp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keygen:
    logging: *default-logging
    image: alpine/openssl
    profiles: [all, infra]
    volumes:
      - ./keys:/keys
    entrypoint: sh
    command: >
      -c "
      if [ ! -f /keys/private.key ]; then
        openssl genpkey -algorithm RSA -out /keys/private.key -pkeyopt rsa_keygen_bits:2048;
        openssl rsa -pubout -in /keys/private.key -out /keys/public.key;
        chmod 644 /keys/private.key /keys/public.key;
        echo 'Chaves de dev geradas em ./keys';
      else
        echo 'Chaves já existem, pulando geração.';
      fi"

  grafana-lgtm:
    logging: *default-logging
    image: 'grafana/otel-lgtm:latest'
    profiles: [all, infra]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: false
      LOKI_EXTRA_ARGS: "-store.retention=720h -compactor.retention-enabled=true -compactor.delete-request-store=filesystem"
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=30d"
    volumes:
      - grafana-lgtm-data:/data
    ports:
      - "127.0.0.1:3000:3000" # acesso local; remoto via túnel SSH
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'

  alloy:
    logging: *default-logging
    image: grafana/alloy:latest
    profiles: [all, infra]
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    depends_on:
      grafana-lgtm:
        condition: service_started
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

volumes:
  postgres-data:
  seaweed-data:
  rabbitmq_data:
  redis-data:
  grafana-lgtm-data:
  alloy-data:
