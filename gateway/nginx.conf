events {}

http {
    set_real_ip_from 172.18.0.0/12;
    real_ip_header X-Real-IP;

    limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
    limit_req_status 429;

    server {
        listen 8080;
        listen [::]:8080;

        resolver 127.0.0.11 valid=10s ipv6=off;

        location /about {
            default_type application/json;
            return 200 '{"description":"proxy","version":"0.1"}';
        }

        # Redirecionamento relativo ajustado para subcaminhos
        location = / {
            return 302 swagger-ui/index.html;
        }

        error_page 429 = @too_many;

        location @too_many {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":"too many requests"}';
        }

        location / {
            limit_req zone=api burst=100 nodelay;

            set $backend http://ccomp-backend:8080;
            proxy_pass $backend;

            proxy_next_upstream error timeout http_502 http_503;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        }
    }
}