events {}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/m;
    limit_req_status 429;

    server {
        listen 8080;
        listen [::]:8080;

         resolver 127.0.0.11 valid=10s ipv6=off;

        location /about {
            default_type application/json;
            return 200 '{"description":"proxy","version":"0.1"}';
        }

        location = / {
            return 302 /swagger-ui/index.html;
        }

        error_page 429 = @too_many;

        location @too_many {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":"too many requests"}';
        }

        location /storage-files/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://seaweeds:9000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;

            # Necessário para PUT via presigned URL a partir do navegador
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "$http_origin" always;
                add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS" always;
                add_header Access-Control-Allow-Headers "*" always;
                add_header Access-Control-Max-Age 3600;
                return 204;
            }
            add_header Access-Control-Allow-Origin "$http_origin" always;
        }

        location / {
            limit_req zone=api burst=50 nodelay;

            set $backend http://ccomp-backend:8080;
            proxy_pass $backend;

            proxy_next_upstream error timeout http_502 http_503;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}